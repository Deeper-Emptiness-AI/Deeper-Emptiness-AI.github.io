<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Healthya — 홈 밖의 화면들</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
:root{--f:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#08090C;color:#fff;font-family:var(--f);-webkit-font-smoothing:antialiased;padding:60px 44px 120px}
.head{max-width:1040px}
.k{font-size:13px;color:rgba(255,255,255,.42)}
h1{font-size:46px;font-weight:800;letter-spacing:-.045em;line-height:1.06;margin-top:14px}
.bar-top{display:flex;align-items:center;gap:8px;margin-top:26px;flex-wrap:wrap}
.btn-t{font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.06);color:#fff;cursor:pointer;font-family:var(--f)}
.btn-t.on{background:#fff;color:#0B0D11;border-color:#fff}
.sep{width:1px;height:20px;background:rgba(255,255,255,.16);margin:0 5px}
.lbl{font-size:11.5px;color:rgba(255,255,255,.34);letter-spacing:.05em}
#tRange{width:190px;accent-color:#fff;cursor:ew-resize}
#tVal{font-size:13px;font-weight:600;color:rgba(255,255,255,.7);width:52px}
.deckrow{display:flex;gap:26px;align-items:flex-start;margin-top:28px;overflow-x:auto;padding:6px 4px 20px}
.deckrow::-webkit-scrollbar{height:8px}.deckrow::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:4px}
body[data-fit="1"] .fr{zoom:.5}
.cell{flex:none;position:relative}
.cap{font-size:12.5px;color:rgba(255,255,255,.44);margin-bottom:10px}
.cap b{color:rgba(255,255,255,.86);font-weight:600}
.cap .ok{color:#7BE0A8}.cap .mid{color:#FFD98E}

.fr{position:relative;overflow:hidden;border-radius:42px;background:#0B0D11;color:#fff;flex:none;--fs:1;
  box-shadow:0 26px 70px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.09);touch-action:none;user-select:none;
  --half:#FFC86B;--miss:#FF8E8E}
.fr.ink{color:#12202F}
.sky{position:absolute;inset:0;transition:filter .5s ease}
.sun,.moon{position:absolute;border-radius:50%;pointer-events:none;translate:-50% -50%;transition:opacity .4s}
.sun{width:96px;height:96px;background:radial-gradient(circle,#FFFCF0 0%,#FFF2CE 26%,rgba(255,222,160,.5) 46%,rgba(255,205,130,0) 72%)}
.moon{width:58px;height:58px;background:radial-gradient(circle,#FBFCFF 0%,#DCE6FA 40%,rgba(190,208,244,.32) 62%,rgba(170,192,238,0) 78%)}
.stars{position:absolute;inset:0;pointer-events:none;transition:opacity .5s}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 3.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:.9}}
.clouds{position:absolute;inset:-10% -20%;pointer-events:none;opacity:0;transition:opacity .6s,filter .5s}
.clouds b{position:absolute;border-radius:50%;filter:blur(22px);animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-8%)}to{transform:translateX(8%)}}
/* ★메시 — 시간 × 날씨로 도는 색 덩이 4개 (§4-A) */
.mesh{position:absolute;inset:-14%;pointer-events:none;filter:blur(2px)}
.veil{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .6s,background .6s}
/* ── 흐린 날 ★ ───────────────────────────────────────────────
   흐림은 「구름이 몇 개 떠 있는 하늘」이 아니라 **덮인 하늘**이다.
   개별 덩이가 보이면 그 순간 흐림이 아니라 「구름 조금」이 된다.
     1) 구름 천장 두 겹 — 높은 층은 넓고 느리게, 낮은 층은 길고 빠르게
     2) 천장 그라데이션 — 위가 어둡다(덮개의 아랫면), 지평선 쪽은 살짝 탁하게 밝다
     3) 해는 점이 아니라 **천장 뒤에서 번지는 밝은 자리** */
.deck{position:absolute;inset:-22%;pointer-events:none;opacity:0;transition:opacity .7s}
.deck i{position:absolute;inset:0;display:block}
.deck .hi{filter:blur(18px);
  background:
    radial-gradient(58% 30% at 18% 12%, rgba(255,246,232,.60), transparent 72%),
    radial-gradient(52% 26% at 74% 22%, rgba(236,240,255,.52), transparent 74%),
    radial-gradient(66% 30% at 44% 40%, rgba(104,96,146,.44), transparent 74%),
    radial-gradient(72% 32% at 84% 56%, rgba(78,102,124,.40), transparent 76%),
    radial-gradient(80% 34% at 24% 68%, rgba(140,116,120,.32), transparent 76%),
    radial-gradient(60% 26% at 62% 88%, rgba(240,236,252,.44), transparent 74%);
  animation:deckA 54s ease-in-out infinite alternate}
.deck .lo{filter:blur(11px);
  background:
    radial-gradient(58% 13% at 26% 34%, rgba(255,250,238,.46), transparent 76%),
    radial-gradient(66% 11% at 76% 52%, rgba(84,80,128,.36), transparent 78%),
    radial-gradient(50% 10% at 44% 18%, rgba(238,244,255,.38), transparent 78%),
    radial-gradient(62% 12% at 58% 72%, rgba(74,104,116,.30), transparent 78%);
  animation:deckB 25s linear infinite alternate}
@keyframes deckA{from{transform:translate3d(-4%,-1.5%,0) scale(1.04)}to{transform:translate3d(4%,1.5%,0) scale(1.1)}}
@keyframes deckB{from{transform:translate3d(-9%,1%,0)}to{transform:translate3d(9%,-1%,0)}}
.fr[data-wx="cloudy"] .deck{opacity:1}
.fr[data-wx="rain"] .deck{opacity:.9;filter:brightness(1.02) saturate(1.06)}
.fr[data-wx="snow"] .deck{opacity:.62;filter:brightness(1.06)}
/* 덮개의 아랫면 — 위가 어둡고 지평선이 탁하게 밝다 */
.ceil{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .7s;
  background:linear-gradient(180deg,rgba(84,78,122,.48),rgba(110,108,150,.26) 30%,
             rgba(146,142,158,.14) 58%,rgba(186,158,132,.26) 100%)}
.fr[data-wx="cloudy"] .ceil{opacity:1}
.fr[data-wx="rain"] .ceil{opacity:1;background:linear-gradient(180deg,rgba(120,134,186,.28),rgba(150,166,206,.10) 34%,
             rgba(186,200,226,0) 58%,rgba(206,192,182,.18) 100%)}
.fr[data-wx="snow"] .ceil{opacity:1;background:linear-gradient(180deg,rgba(146,158,206,.30),rgba(178,192,226,.10) 34%,
             rgba(206,214,238,0) 58%,rgba(226,212,206,.18) 100%)}
/* 해는 천장 뒤에서 번진다 — 가장자리 없는 밝은 자리 */
/* ★흐림·비·눈에도 해는 떠 있다. 점이 아니라 **천장 뒤에서 번지는 밝은 자리**로 */
.fr[data-wx="cloudy"] .sun,.fr[data-wx="snow"] .sun,.fr[data-wx="rain"] .sun{
  width:250px;height:250px;filter:blur(22px)}
.glow{position:absolute;border-radius:50%;translate:-50% -50%;pointer-events:none;opacity:0;transition:opacity .6s;
  width:560px;height:560px;mix-blend-mode:screen;
  background:radial-gradient(circle,rgba(255,248,226,.74) 0%,rgba(255,242,208,.36) 30%,
             rgba(255,238,204,.14) 52%,rgba(255,236,200,0) 70%)}
.fr[data-wx="cloudy"] .glow,.fr[data-wx="snow"] .glow{opacity:1}
.fr[data-wx="rain"] .glow{opacity:.8}
.fr[data-wx="clear"] .glow{opacity:.55}   /* 맑은 날도 해 쪽 하늘이 더 밝다 */
/* ★해의 자리를 짚는 옅은 테두리 — UI 마커가 아니라 **구름 사이로 비치는 해무리**.
   안쪽 링 = 해의 원반, 바깥 링 = 무리. 둘 다 아주 옅게 */
.sunring{position:absolute;translate:-50% -50%;pointer-events:none;opacity:0;transition:opacity .6s;
  width:104px;height:104px;border-radius:50%;
  border:1.2px solid rgba(255,250,234,.62);
  box-shadow:0 0 0 1px rgba(255,248,226,.16) inset, 0 0 22px rgba(255,246,220,.26)}
.sunring::after{content:'';position:absolute;inset:-52px;border-radius:50%;
  border:1px solid rgba(255,248,228,.22)}

/* ── 비 ★ (입자 방식, 2026-09-14 재작성) ─────────────────────
   시트(repeating-gradient + mask)는 아무리 끊어도 **같은 길이·같은 간격의 격자**라 티가 난다.
   눈이 잘 나온 이유가 입자였으므로 비도 입자로 간다 — 76개 빗줄기가 각자
   **길이·위치·속도·기울기·흐림**을 따로 가진다. 양 끝이 녹는 그라데이션 = 모션 블러. */
.rain{position:absolute;inset:-14% -10% 0;pointer-events:none;opacity:0;transition:opacity .5s}
.rain i{position:absolute;top:-16%;display:block;border-radius:2px;
  background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.85) 42%,rgba(255,255,255,.15) 78%,rgba(255,255,255,0));
  animation:rfall linear infinite}
/* ★가로 이동은 px 로. %로 두면 요소 자기 폭(1~3px) 기준이라 사실상 안 움직인다 —
   그러면 기울어진 빗줄기가 수직으로 떨어지는 이상한 그림이 된다 */
@keyframes rfall{from{transform:translate3d(0,0,0)}to{transform:translate3d(-116px,128vh,0)}}
/* 빗발 — 밀도가 가로로 흐른다(소나기 결) */
.rain .gust{position:absolute;inset:-10%;
  background:radial-gradient(120% 60% at 20% 40%,rgba(255,255,255,.09),transparent 60%),
             radial-gradient(90% 70% at 78% 60%,rgba(255,255,255,.06),transparent 62%);
  animation:gust 9s ease-in-out infinite alternate}
@keyframes gust{from{transform:translateX(-6%)}to{transform:translateX(6%)}}

/* ★유리창에 맺힌 물방울 — 「비 오는 느낌」의 8할은 사실 이것이다.
   카드보다 뒤(z 16)에 둬서 하늘에만 맺히게 한다 — UI 위로 올리면 가독성을 깬다 */
.drops{position:absolute;inset:0;pointer-events:none;z-index:16;opacity:0;transition:opacity .6s}
.fr[data-wx="rain"] .drops{opacity:1}
.drops b{position:absolute;border-radius:50%;
  background:radial-gradient(circle at 34% 30%, rgba(255,255,255,.62), rgba(255,255,255,.14) 44%, rgba(255,255,255,.03) 70%);
  box-shadow:inset -1px -1.5px 2px rgba(255,255,255,.5), 0 1px 2px rgba(10,18,36,.18)}
.drops b.run{animation:run linear infinite}
@keyframes run{0%{transform:translateY(0);opacity:.9}88%{opacity:.9}100%{transform:translateY(190px);opacity:0}}

/* 번개 — 화면 전체 흰 섬광은 촌스럽다. 위쪽만, 짧게, 드물게 */
.bolt{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:linear-gradient(180deg,rgba(214,230,255,.55),rgba(186,210,255,.14) 26%,transparent 46%)}
.fr[data-wx="rain"] .bolt{animation:bolt 13s linear infinite}
@keyframes bolt{0%,93%{opacity:0}93.6%{opacity:.55}94.4%{opacity:.04}95%{opacity:.34}96%{opacity:0}100%{opacity:0}}
/* ── 눈 ★ ────────────────────────────────────────────────────
   낙하만 시키면 「떨어지는 흰 점」이다. 진짜 눈은 **흔들리며** 내리고,
   가까운 눈은 크고 흐릿(초점 밖)하고 먼 눈은 작고 선명하다. */
.snow{position:absolute;inset:-8% 0 0;pointer-events:none;opacity:0;transition:opacity .5s}
.snow i{position:absolute;top:-6%;display:block;animation:fall linear infinite}
.snow b{display:block;border-radius:50%;
  background:radial-gradient(circle at 42% 38%, rgba(255,255,255,.98), rgba(255,255,255,.55) 46%, rgba(255,255,255,0) 72%);
  animation:sway ease-in-out infinite alternate}
@keyframes fall{from{transform:translateY(0)}to{transform:translateY(112vh)}}
@keyframes sway{from{transform:translateX(-9px) rotate(-14deg)}to{transform:translateX(9px) rotate(14deg)}}
.scrim{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.2) 0%,rgba(0,0,0,0) 24%,rgba(0,0,0,0) 48%,rgba(0,0,0,.4) 100%)}
.fr[data-wx="rain"] .scrim{background:linear-gradient(180deg,rgba(6,10,26,.5) 0%,rgba(6,10,26,.12) 30%,rgba(0,0,0,0) 52%,rgba(0,0,0,.44) 100%)}
.fr[data-wx="snow"] .scrim{background:linear-gradient(180deg,rgba(120,160,210,.22) 0%,rgba(0,0,0,0) 34%,rgba(0,0,0,0) 52%,rgba(0,0,0,.34) 100%)}
.isl{position:absolute;top:12px;left:50%;translate:-50% 0;width:112px;height:32px;border-radius:20px;background:#000;z-index:60}
.sb{position:absolute;top:20px;left:0;right:0;display:flex;justify-content:space-between;padding:0 30px;font-size:14px;font-weight:600;z-index:55;opacity:.92}
.hi{position:absolute;bottom:9px;left:50%;translate:-50% 0;width:128px;height:5px;border-radius:3px;background:currentColor;opacity:.28;z-index:60}
.g{background:rgba(255,255,255,.16);backdrop-filter:blur(22px) saturate(1.35);-webkit-backdrop-filter:blur(22px) saturate(1.35);border:1px solid rgba(255,255,255,.3)}
.fr.ink .g{background:rgba(255,255,255,.5);border-color:rgba(255,255,255,.75)}


/* ── 유리 재질 ★ ──────────────────────────────────────────────
   평면 사각형 + 반투명이 아니라, 「두께가 있는 유리판」으로 만든다.
     1) 테두리를 그라데이션으로 — 광원 쪽만 밝다
     2) 윗면 하이라이트 + 아랫면 접지 그림자 = 두께
     3) 테두리 바로 안쪽 굴절 띠 = 빛이 모서리에서 꺾인다
     4) 아주 옅은 그레인 = 「면」이 아니라 「재질」
     5) ★하이라이트 각도(--gAng)가 **해를 따라 돈다** — 아침엔 왼쪽 위, 저녁엔 오른쪽 위 */
.fr[data-glass="2"] .g{
  background:
    linear-gradient(var(--gAng,180deg), rgba(255,255,255,.22), rgba(255,255,255,.06) 46%, rgba(255,255,255,.13));
  backdrop-filter:blur(26px) saturate(1.7) brightness(1.03);
  -webkit-backdrop-filter:blur(26px) saturate(1.7) brightness(1.03);
  border:none;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.26),
    inset 0 -1px 0 rgba(16,26,44,.10),
    var(--shX,0px) 24px 52px -16px rgba(10,18,36,.46),
    calc(var(--shX,0px) * .35) 4px 12px -6px rgba(10,18,36,.28);
}
.fr.ink[data-glass="2"] .g{
  background:
    linear-gradient(var(--gAng,180deg), rgba(255,255,255,.46), rgba(255,255,255,.26) 46%, rgba(255,255,255,.36));
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.6),
    inset 0 -1px 0 rgba(18,32,47,.08),
    0 22px 46px -18px rgba(18,32,47,.30), 0 4px 10px -6px rgba(18,32,47,.16);
}
/* 테두리 = 광원 쪽만 밝은 2px 링 */
.fr[data-glass="2"] .g::before{
  content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:3;
  background:linear-gradient(var(--gAng,180deg),
    rgba(255,255,255,.58), rgba(255,255,255,.14) 26%, rgba(255,255,255,.02) 56%, rgba(255,255,255,.24));
  -webkit-mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);
  -webkit-mask-composite:xor;mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);
  mask-composite:exclude;
}
.fr.ink[data-glass="2"] .g::before{
  background:linear-gradient(var(--gAng,180deg),
    rgba(255,255,255,.82), rgba(255,255,255,.40) 26%, rgba(255,255,255,.14) 56%, rgba(255,255,255,.46));
}
/* ★상단 광택 밴드 + 아래 두께 컷 — 유리판의 「윗면」과 「단면」 */
.fr[data-glass="2"] .g::after{
  content:'';position:absolute;inset:1.6px;border-radius:inherit;pointer-events:none;z-index:2;
  background:linear-gradient(var(--gAng,180deg),
    rgba(255,255,255,.38) 0%, rgba(255,255,255,.14) 18%, rgba(255,255,255,.03) 34%, rgba(255,255,255,0) 48%);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.08),
    inset 0 -1.5px 0 rgba(255,255,255,.18),
    inset 0 -12px 20px -12px rgba(14,22,40,.30);
}
.fr.ink[data-glass="2"] .g::after{
  background:linear-gradient(var(--gAng,180deg),
    rgba(255,255,255,.58) 0%, rgba(255,255,255,.26) 18%, rgba(255,255,255,.06) 34%, rgba(255,255,255,0) 48%);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.22),
    inset 0 -1.5px 0 rgba(255,255,255,.34),
    inset 0 -12px 20px -14px rgba(18,32,47,.18);
}
/* 그레인 — 밴딩을 없애고 「재질」로 만든다 */
.fr[data-glass="2"]::after{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:45;opacity:.042;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");
}
/* 카메라 원도 같은 재질감 — 흰색은 유지(§9-B) */
.fr[data-glass="2"] .cam{
  background:linear-gradient(var(--gAng,180deg),#fff,#F3F6FB 58%,#E9EEF7);
  box-shadow:var(--shX,0px) 12px 30px rgba(0,0,0,.34),0 0 0 5px rgba(255,255,255,.16),
    inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 3px rgba(18,32,47,.10);
}
.fr.ink[data-glass="2"] .cam{
  box-shadow:0 12px 26px rgba(18,32,47,.28),0 0 0 1px rgba(18,32,47,.10),
    inset 0 1px 0 #fff,inset 0 -2px 3px rgba(18,32,47,.10);
}

/* ★유리는 하루 종일 동일하다 (2026-09-14 결정) — 낮이라고 하얘지지도, 어두워지지도 않는다.
   잉크 반전은 유리 표면에서 폐기. 글씨는 늘 흰색이고, 맨 하늘 위 글씨만 그림자로 받친다. */
/* 유리는 안 건드린다. 대신 **글씨에 그림자**를 얹어 밝은 하늘에서의 대비를 살린다 */
.fr[data-glass="2"] .card,.fr[data-glass="2"] .di,.fr[data-glass="2"] .aibar,
.fr[data-glass="2"] .chat,.fr[data-glass="2"] .blob,.fr[data-glass="2"] .more{
  text-shadow:0 1px 2px rgba(8,16,34,.45)}
.fr[data-glass="2"] .top{text-shadow:0 1px 4px rgba(8,16,34,.5),0 0 18px rgba(8,16,34,.28)}
.fr[data-glass="2"] .sb{text-shadow:0 1px 3px rgba(8,16,34,.40)}
/* ══════════════════════════════════════════════════════════════════
   화면 문법 — 홈 밖의 화면 = **하늘 위로 올라온 유리 시트 한 장**
   홈은 하늘이 주인공이고 카드가 그 위에 뜬다. 하위 화면은 뒤집힌다 —
   시트가 주인공이고, 하늘은 시트 위쪽에 띠로 남아 **시각과 날씨를 계속 말한다.**
   같은 하늘 · 같은 유리 · 같은 하단 3층. 바뀌는 것은 시트 안뿐이다.
   ══════════════════════════════════════════════════════════════════ */
.hbtn{position:absolute;z-index:24;border-radius:50%;display:grid;place-items:center;
  font-size:calc(17px * var(--fs));font-weight:700;cursor:pointer}
.title{position:absolute;z-index:22}
.title .ti{font-weight:800;letter-spacing:-.045em;line-height:1.04}
.title .su{font-size:calc(15px * var(--fs));opacity:.76;margin-top:7px;letter-spacing:-.02em}
.sheet{position:absolute;z-index:18;border-radius:28px;overflow:hidden;display:flex;flex-direction:column}

.sbody .col{min-width:0;display:flex;flex-direction:column;gap:14px;width:100%}

/* ★시트 안의 블록은 **줄어들지 않는다**. flex 자식은 기본이 shrink:1 이라
   가로 스크롤(overflow-x)을 가진 레일이 높이 0 으로 찌그러진다 — 실제로 그랬다 */
.sbody>*,.sbody .col>*{flex:none}

/* ★시트 안에는 블러를 다시 쓰지 않는다 — 유리 위의 유리는 탁해지고 블러 층이 배로 든다.
   안쪽 단은 「반투명 흰 면 + 1px 선」만으로 만든다. 블러는 화면당 시트 한 장 + 하단 3층뿐 */
.tile{border-radius:18px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);

.l{font-size:calc(13px * var(--fs));opacity:.74}
.big{font-weight:800;letter-spacing:-.05em;line-height:1;margin-top:9px;font-size:calc(40px * var(--fs))}
.big em{font-style:normal;font-size:calc(17px * var(--fs));font-weight:600;opacity:.6;margin-left:5px;letter-spacing:-.02em}
.big2{font-weight:700;letter-spacing:-.045em;line-height:1.05;margin-top:8px;font-size:calc(30px * var(--fs))}
.sub2{font-size:calc(14px * var(--fs));opacity:.76;margin-top:7px;letter-spacing:-.02em}
.chips{display:flex;gap:6px;margin-top:13px;flex-wrap:wrap}

/* 가로 레일 — 오늘 기록한 것들 */
.rail{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px}

/* 목록 — 시각 · 이름 · 상태. ★상태색은 홈과 같은 둘뿐(--half 금색 · --miss 빨강) */
.list{padding:3px 0}

/* ★밝은 하늘 위 유리에서 **빨강 글씨는 약하다**(정오에 특히). 색은 **면**이 지고
   글씨는 흰색으로 간다 — 상태색을 글씨에만 얹는 홈의 `.card.miss` 도 같은 점검이 필요하다 */

/* 영양 막대 */
.nut{display:flex;flex-direction:column;gap:9px;margin-top:12px}

/* 함께하기 */
.avs{display:flex;margin-top:11px}
.avs i{width:calc(26px * var(--fs));height:calc(26px * var(--fs));border-radius:50%;margin-right:-7px;
  background:rgba(255,255,255,.3);border:1.5px solid rgba(255,255,255,.5)}
.avs i.off{background:rgba(255,255,255,.12)}

/* 하단 3층 — ★홈과 같은 자리, 같은 값. 화면이 바뀌어도 손가락 위치는 안 바뀐다 */

  gap:3px;translate:-50% -50%}

  translate:-50% -50%;font-size:16px;font-weight:700;letter-spacing:.06em}
.cam{position:absolute;border-radius:50%;background:#fff;z-index:36;box-shadow:0 10px 30px rgba(0,0,0,.35),0 0 0 5px rgba(255,255,255,.16)}

.fr[data-glass="2"] .sheet,.fr[data-glass="2"] .hbtn,.fr[data-glass="2"] .aibar,.fr[data-glass="2"] .di{
  text-shadow:0 1px 2px rgba(8,16,34,.45)}

<script>
const KF=[{p:0,c:['#0A0F24','#121838','#20264C']},{p:.20,c:['#2E4A7D','#7FA3CE','#E8C9A6']},
 {p:.40,c:['#2F7DD1','#6FB4EA','#C3E2F7']},{p:.62,c:['#3B6FA8','#9E86A8','#E8B287']},
 {p:.80,c:['#24304F','#6B5175','#DFA477']},{p:.92,c:['#0D1330','#161E42','#2A2F58']},
 {p:1,c:['#0A0F24','#121838','#20264C']}];
const BAND=t=>t<.20?'새벽':t<.44?'아침':t<.62?'낮':t<.86?'저녁':'밤';
const WX={
 clear :{n:'맑음',ico:'☀',t:'22°',cloud:0,  veil:'rgba(0,0,0,0)',        vo:0,sat:1,  rain:0,snow:0,sun:1},
 cloudy:{n:'흐림',ico:'☁',t:'18°',cloud:.85,veil:'rgba(150,146,182,.34)',vo:1,sat:.58,rain:0,snow:0,sun:.16,deck:1,dim:.94},
 rain  :{n:'비',ico:'🌧',t:'16°',cloud:1,  veil:'rgba(150,168,206,.26)', vo:1,sat:.60,rain:1,snow:0,sun:.12,deck:1,dim:.97},
 snow  :{n:'눈',ico:'❄',t:'-1°',cloud:.85,veil:'rgba(216,230,252,.24)',vo:1,sat:.60,rain:0,snow:1,sun:.18,deck:1,dim:.97},
};
/* st: done(한 것) / half(일부) / miss(지나갔는데 안 함) / todo(앞으로) */
const TODO=[
 {k:'수면',    s:'7시간 12분', sub:'', at:.14, st:'done'},
 {k:'물',      s:'5잔',        sub:'하루 8잔 중', at:.29, st:'done'},
 {k:'혈압약',  s:'먹었어요',   sub:'아침 · 식사 후', at:.34, st:'done'},
 {k:'혈압',    s:'122/78',     sub:'', at:.37, st:'done'},
 {k:'작심삼일',s:'9일차',      sub:'오늘 절반', at:.44, st:'half'},
 {k:'점심',    s:'비빔밥 620', sub:'', at:.53, st:'done'},
 {k:'걷기',    s:'3,120보',    sub:'목표 4,000보', at:.61, st:'done'},
 {k:'오후 약', s:'',           sub:'2시 · 식사 후', at:.68, st:'miss'},
 {k:'저녁 약', s:'',           sub:'밤 9시 · 식사 후', at:.88, st:'todo'},
];
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const MESHKF=[
 /* ★한 국면에 **네 색**을 둔다. 덩이를 작게 잡아 서로 뭉개지지 않게 —
    크게 잡으면 겹쳐서 평균색 한 덩어리가 된다(3덩이 큰 반경으로 해 봤더니 그랬다).
    구성은 늘 [뜨거운 / 차가운 / 금 / 네 번째 대비색]. 시간은 이 사각형을 돌린다. */
 {p:0,   c:[[240, 60,176,.70],[ 60, 56,238,.70],[255,146, 64,.46],[ 60,214,214,.44]]}, /* 밤 */
 {p:.20, c:[[255,102,158,.74],[ 76, 96,255,.66],[255,188,104,.62],[176, 96,255,.56]]}, /* 새벽 */
 {p:.40, c:[[255, 88,168,.66],[ 58,150,255,.70],[255,212, 84,.62],[188, 84,255,.52]]}, /* 낮 */
 {p:.62, c:[[255, 72,136,.72],[100, 84,255,.66],[255,186, 52,.66],[ 56,206,226,.50]]}, /* 오후 */
 {p:.80, c:[[255, 62, 96,.78],[152, 44,214,.70],[255,146, 48,.70],[ 70, 96,240,.54]]}, /* 저녁 */
 {p:.92, c:[[246, 62,184,.72],[ 54, 50,232,.70],[255,138, 64,.48],[ 66,206,220,.44]]}, /* 밤 */
 {p:1,   c:[[240, 60,176,.70],[ 60, 56,238,.70],[255,146, 64,.46],[ 60,214,214,.44]]},
];
/* ★날씨가 메시를 물들이는 방식 (2026-09-14 개정)
   **하나의 회색으로 lerp 하면 네 색이 같은 색으로 평균나 버린다**(실제로 그랬다).
   인상파의 흐린 날처럼 — **채도만 내리고 색상 구분은 살린다**:
     1) desat = 각 색을 **자기 자신의 명도** 쪽으로 당긴다 → 색상(hue)은 유지, 채도만 하락
     2) mul  = 전체에 곱하기 틴트 → 날씨의 기온감(비는 남색, 눈은 청백)
     3) warm/cool = 짝수 덩이는 따뜻하게, 홀수는 차갑게 → **보색 구조가 남는다**
        (따뜻한 빛 / 차가운 그림자 — 흐린 날에 색이 살아 있는 이유) */
const WXMESH={
 clear :{de:0,   mul:[1,1,1],          a:1.00, wc:0},
 cloudy:{de:.40, mul:[.90,.93,1.00],   a:.82,  wc:.10},
 rain  :{de:.36, mul:[.94,.98,1.12],   a:.92,  wc:.12},
 snow  :{de:.34, mul:[1.00,1.04,1.12], a:.88,  wc:.08},
};
const WARM=[1.10,1.00,.86], COOL=[.88,.97,1.14];
const lum=c=>.2126*c[0]+.7152*c[1]+.0722*c[2];
function meshAt(t,wk){
  let i=0; while(i<MESHKF.length-2 && t>MESHKF[i+1].p) i++;
  const a=MESHKF[i],b=MESHKF[i+1],u=cl((t-a.p)/(b.p-a.p||1),0,1);
  const W=WXMESH[wk];
  return a.c.map((c,j)=>{
    let q=c.map((v,k)=>v+(b.c[j][k]-v)*u);
    const L=lum(q);
    q=[q[0]+(L-q[0])*W.de, q[1]+(L-q[1])*W.de, q[2]+(L-q[2])*W.de, q[3]];
    const bias=(j%2===0)?WARM:COOL;
    q=[q[0]*W.mul[0]*(1+(bias[0]-1)*W.wc*10)/1,
       q[1]*W.mul[1]*(1+(bias[1]-1)*W.wc*10),
       q[2]*W.mul[2]*(1+(bias[2]-1)*W.wc*10), q[3]];
    return `rgba(${cl(q[0]|0,0,255)},${cl(q[1]|0,0,255)},${cl(q[2]|0,0,255)},${(q[3]*W.a).toFixed(3)})`;
  });
}

const hx=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const lc=(a,b,u)=>{const A=hx(a),B=hx(b);return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*u)).join(',')})`;};
function skyAt(t){let i=0;while(i<KF.length-2&&t>KF[i+1].p)i++;const a=KF[i],b=KF[i+1],u=cl((t-a.p)/(b.p-a.p||1),0,1);
  return a.c.map((c,j)=>lc(c,b.c[j],u));}
const clockAt=t=>{const h=t*24;return `${Math.floor(h)%24}:${String(Math.floor((h%1)*60)).padStart(2,'0')}`;};
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const MIC='<svg viewBox="0 0 24 24"><path d="M12 14.5a3.2 3.2 0 0 0 3.2-3.2V5.7a3.2 3.2 0 1 0-6.4 0v5.6a3.2 3.2 0 0 0 3.2 3.2zm5.6-3.4a.9.9 0 0 0-1.8 0 3.8 3.8 0 0 1-7.6 0 .9.9 0 0 0-1.8 0 5.6 5.6 0 0 0 4.7 5.5v2a.9.9 0 0 0 1.8 0v-2a5.6 5.6 0 0 0 4.7-5.5z"/></svg>';
/* 원호 8개 = §8-C 기본값. ★앞 4개는 도크에 상시 노출되고, 끌어올리면 나머지 4개가 이어 붙는다 */

/* ── 고개 그래픽 — 3일 한 고개. 넘은 고개에 깃발이 꽂힌다 ─────────── */
function hill(days,today){
  let d='',pts=[];
  for(let i=0;i<3;i++){const x0=6+88*i;
    d+=`M${x0} 56 Q ${x0+44} -30 ${x0+88} 56 `;
    [.3,.6,.9].forEach(t=>{const v=1-t;
      pts.push([(v*v*x0+2*v*t*(x0+44)+t*t*(x0+88)).toFixed(1),
                (v*v*56+2*v*t*(-30)+t*t*56).toFixed(1)]);});
  }
  const dots=pts.map(([x,y],i)=>i<days?`<circle class="dot on" cx="${x}" cy="${y}" r="3.4"/>`
    :i===today?`<circle class="dot now" cx="${x}" cy="${y}" r="4.6"/>`
    :`<circle class="dot" cx="${x}" cy="${y}" r="3"/>`).join('');
  const flags=[0,1,2].filter(i=>days>=(i+1)*3).map(i=>{const x=6+88*(i+1);
    return `<g class="flag"><path d="M${x} 56 L${x} 34"/><path class="fl" d="M${x} 34 L${x+14} 39.5 L${x} 45 Z" fill="var(--half)" stroke="none"/></g>`;}).join('');
  return `<div class="hill"><svg viewBox="-5 8 294 54"><path d="${d}"/>${flags}${dots}</svg></div>`;
}

  const sunring=el('div','sunring');
  const clouds=el('div','clouds');
  [[6,10,190,86,26],[38,4,240,104,34],[64,16,200,78,30],[18,26,170,66,38],[78,30,160,60,22],[48,22,150,58,42]]
    .forEach(([x,y,cw,ch,dur])=>{const b=el('b');
      b.style.cssText=`left:${x}%;top:${y}%;width:${cw}px;height:${ch}px;animation-duration:${dur}s;`+
        `background:radial-gradient(circle at 40% 45%,rgba(255,255,255,.92),rgba(232,238,248,.55) 55%,rgba(210,220,235,0) 74%)`;
      clouds.appendChild(b);});
  const veil=el('div','veil');
  /* 비 — 3티어 76개. 근경은 길고 굵고 빠르고 흐리다 */
  const rain=el('div','rain');
  const RT=[{n:72,w:1.0,h:[14,10],o:.30,b:0,   d:[1.45,.45]},
            {n:44,w:1.6,h:[28,18],o:.48,b:.35,d:[.95,.28]},
            {n:16,w:2.8,h:[52,30],o:.62,b:1.3, d:[.58,.16]}];
  let rk=0;
  RT.forEach(T=>{
    for(let i=0;i<T.n;i++,rk++){
      const st=el('i'), r1=(rk*37%101)/101, r2=(rk*61%97)/97, r3=(rk*23%89)/89;
      st.style.cssText=`left:${(r1*106-3).toFixed(1)}%;width:${T.w}px;height:${(T.h[0]+r2*T.h[1]).toFixed(0)}px;`+
        `opacity:${(T.o*(.7+r3*.5)).toFixed(2)};filter:blur(${T.b}px);`+
        `transform-origin:50% 0;rotate:${(5.4+r3*1.4).toFixed(1)}deg;`+
        `animation-duration:${(T.d[0]+r2*T.d[1]).toFixed(2)}s;animation-delay:${(-r1*2.2).toFixed(2)}s`;
      rain.appendChild(st);
    }
  });
  rain.appendChild(el('div','gust'));
  /* 유리창 물방울 — 크기·위치를 흩고, 몇 개만 흘러내린다 */
  const drops=el('div','drops');
  for(let i=0;i<15;i++){
    const d=document.createElement('b');
    const sz=3+(i%5)*2.6, run=(i%5===0);
    if(run) d.className='run';
    d.style.cssText=`left:${(i*13.7+5)%94}%;top:${(i*17.3+7)%78}%;width:${sz}px;height:${(sz*1.12).toFixed(1)}px;`+
      `opacity:${.45+(i%4)*.14}`+(run?`;animation-duration:${5.5+(i%3)*2.4}s;animation-delay:${-i*1.7}s`:'');
    drops.appendChild(d);
  }
  /* 눈 — 낙하(track) × 흔들림(flake) 2중. 3티어 깊이로 근경은 크고 흐리고 빠르다 */
  const snow=el('div','snow');
  for(let i=0;i<46;i++){
    const tier=i%3, sz=[2.6,4.6,7.6][tier], bl=[0,.7,2.0][tier];

    flake.style.cssText=`width:${sz}px;height:${sz}px;filter:blur(${bl}px);`+
      `animation-duration:${(1.6+(i%7)*.35).toFixed(2)}s;animation-delay:${-i*.29}s`;
    track.style.cssText=`left:${(i*2.17+1)%99}%;opacity:${[.5,.72,.92][tier]};`+

function paintSky(s){
  const t=s.t,c=skyAt(t),W=WX[WKEY];
  s.sky.style.background=`linear-gradient(180deg,${c[0]} 0%,${c[1]} 48%,${c[2]} 100%)`;
  s.sky.style.filter=`saturate(${(W.sat*1.4).toFixed(2)}) contrast(1.04) brightness(${W.dim||1})`;
  /* ★메시 — 시간 × 날씨. 한 국면에 네 색, 덩이는 작게(§4-A) */
  const mc=meshAt(t,WKEY);
  s.mesh.style.background=
    `radial-gradient(42% 32% at 15% 16%, ${mc[0]} 0%, transparent 64%),`+
    `radial-gradient(40% 34% at 87% 27%, ${mc[1]} 0%, transparent 62%),`+
    `radial-gradient(46% 34% at 26% 74%, ${mc[2]} 0%, transparent 66%),`+
    `radial-gradient(44% 32% at 80% 88%, ${mc[3]} 0%, transparent 64%)`;
  s.fr.dataset.wx=WKEY;
  const dl=cl(Math.sin(Math.PI*cl((t-.16)/.72,0,1)),0,1);
  s.clouds.style.opacity=W.cloud*(W.deck?.22:1);
  s.clouds.style.filter=`brightness(${(.26+.74*dl).toFixed(2)}) contrast(${(1+W.cloud*.55).toFixed(2)})`;
  s.clouds.style.mixBlendMode=dl>.35?'screen':'normal';
  s.veil.style.background=W.veil; s.veil.style.opacity=W.vo;
  s.rain.style.opacity=W.rain; s.snow.style.opacity=W.snow;
  /* ★잉크 반전 폐기 (2026-09-14, §9-A 개정). 유리는 시각과 무관하게 같은 값이고 글씨는 늘 흰색이다.
     밝은 하늘에서의 대비는 유리를 바꾸는 대신 **글씨 그림자**가 받는다(§9-C). */
  s.stars.style.opacity=(t<.16||t>.86?.95:(t<.24||t>.78?.4:0))*(1-W.cloud*.9);
  const shine=t>.19&&t<.83, sx=8+t*84, sy=26-Math.sin(Math.PI*t)*14;
  s.sun.style.cssText=`left:${sx}%;top:${sy}%;opacity:${shine?W.sun:0}`;
  s.glow.style.left=sx+'%'; s.glow.style.top=sy+'%';   /* 구름 뒤 밝은 자리는 해를 따라간다 */
  /* 해무리 링 — 낮에만. 밤엔 달이 이미 자리를 짚는다 */
  s.sunring.style.cssText=`left:${sx}%;top:${sy}%;opacity:${shine?(W.deck?.74:.48):0}`;
  /* ★유리 하이라이트가 광원(해·달)을 따라 돈다 — 왼쪽 위 135° → 정수리 180° → 오른쪽 위 225° */
  const sunN=cl((sx-8)/84,0,1);
  s.fr.style.setProperty('--gAng', (135+sunN*90).toFixed(1)+'deg');
  /* ★그림자는 해 반대쪽으로 눕는다 — 아침엔 오른쪽, 저녁엔 왼쪽.
     별도 UI 없이 **빛의 방향**만으로 해의 위치가 읽힌다 */
  s.fr.style.setProperty('--shX', ((.5-sunN)*30).toFixed(1)+'px');
  s.moon.style.cssText=`left:${sx}%;top:${sy}%;opacity:${shine?0:.95*(1-W.cloud*.8)}`;
}

function build(key,w,h,cap){
  const S=SCREENS[key];
  const sc=w<600?'compact':(w<840?'medium':'expanded');
  const wide=sc==='expanded';
  const cell=el('div','cell'); cell.appendChild(el('div','cap',cap));
  const fr=el('div','fr'); fr.style.width=w+'px'; fr.style.height=h+'px'; fr.dataset.glass='2';
  const sk=makeSky(fr);
  const sb=el('div','sb','<span class="t"></span><span>•••• ᯤ ▯</span>'); fr.appendChild(sb);

  /* 기하 — ★홈(§7-A′)과 **같은 값**을 쓴다. 하단 예산이 화면마다 달라지면 손가락이 헤맨다 */
  const pad=sc==='compact'?24:30, topPad=sc==='compact'?52:56;
  const camS=70, camB=28, aiH=sc==='compact'?50:56;
  const DOCK_H=64, DOCK_B=16, RAIL_W=64;
  const aiB=wide?pad:camB+camS+12;
  const botPad=aiB+aiH+18;
  const camCX=wide?w-pad-camS/2:w/2;
  const railRes=wide?RAIL_W+24:0;

  /* 헤더 — ★왼쪽 ‹ 는 늘 홈으로. 오른쪽은 **그 화면의 동작**이다.
     ⋯ 서랍은 홈 전용이라 여기서 자리를 다투지 않는다 (§13 「⋯ 의 자리」) */
  const back=el('div','hbtn g','‹');
  back.style.cssText+=`left:${pad}px;top:${topPad}px;width:38px;height:38px`;
  const act=el('div','hbtn g',S.right);
  act.style.cssText+=`right:${pad}px;top:${topPad}px;width:38px;height:38px`;
  const title=el('div','title',`<div class="ti">${S.title}</div><div class="su">${S.sub}</div>`);
  title.style.cssText+=`left:${pad}px;right:${pad+(wide?railRes:0)}px;top:${topPad+52}px`;
  title.querySelector('.ti').style.fontSize=`calc(${sc==='compact'?30:36}px * var(--fs))`;
  fr.append(back,act,title);

  /* 시트 — 화면당 유리 한 장. 안쪽 단은 블러 없이 면과 선으로만 */
  const bl=S.blocks(sc);
  const split=typeof S.split==='function'?S.split(sc):(S.split||Math.ceil(bl.length/2));
  const sheet=el('div','sheet g', sc==='compact'
    ? `<div class="sbody"><div class="col">${bl.join('')}</div></div>`
    : `<div class="sbody two"><div class="col">${bl.slice(0,split).join('')}</div>`+
      `<div class="col">${bl.slice(split).join('')}</div></div>`);
  fr.appendChild(sheet);

  const aibar=el('div','aibar g',`<div class="mo">${MIC}</div><div class="tx">${S.ai}</div>`);
  aibar.style.cssText+= wide
    ? `left:${pad}px;width:${w-pad*2-railRes}px;bottom:${aiB}px;height:${aiH}px`
    : `left:${pad}px;right:${pad}px;bottom:${aiB}px;height:${aiH}px`;
  const cam=el('div','cam','<i class="grab"></i>');
  cam.style.cssText+=`width:${camS}px;height:${camS}px;left:${camCX}px;translate:-50% 0;bottom:${camB}px`;

  /* 도크 / 레일 — 홈과 같은 코드, 다른 점은 **지금 화면이 켜져 있다**는 것뿐 */
  const dock=el('div','dock g'); const dis=[];
  if(wide){
    const PITCH=54, IH=48, MORE=52, GAP=14;
    const camTop=h-(camB+camS), rbot=h-(camB+camS/2-17);
    const ys=ARC.map((_,i)=>camTop-GAP-IH/2-PITCH*i);
    const rtop=ys[ARC.length-1]-IH/2-GAP-MORE;
    dock.style.cssText+=`left:${camCX-RAIL_W/2}px;top:${rtop}px;width:${RAIL_W}px;height:${rbot-rtop}px`;
    ARC.forEach((it,i)=>{
      const e=el('div','di'+(i===S.nav?' act':''),`<div class="ic">${it.ic}</div><div class="nm">${it.s}</div>`);
      e.style.cssText+=`left:${camCX}px;top:${ys[i]}px`; dis.push(e);
    });
    const rm=el('div','railmore','⋯'); rm.style.cssText+=`left:${camCX}px;top:${rtop+MORE/2+4}px`; dis.push(rm);
  }else{
    const DW=w-pad*2, lcx=camCX-pad, INSET=8, space=lcx-camS/2-14-INSET;
    const s1=INSET+space*.25, s2=INSET+space*.75;
    dock.style.cssText+=`left:${pad}px;bottom:${DOCK_B}px;width:${DW}px;height:${DOCK_H}px`;
    [s1,s2,DW-s2,DW-s1].forEach((x,i)=>{
      const it=ARC[i];
      const e=el('div','di'+(i===S.nav?' act':''),`<div class="ic">${it.ic}</div><div class="nm">${it.s}</div>`);
      e.style.cssText+=`left:${pad+x}px;bottom:${DOCK_B+DOCK_H/2}px;translate:-50% 50%`; dis.push(e);
    });
  }
  fr.append(dock,...dis,aibar,cam,el('div','hi'));
  cell.appendChild(fr);

  const s={fr,...sk,sb:sb.querySelector('.t'),sheet,title,w,h,sc,pad,topPad,botPad,railRes,wide,t:.53};
  fr._st=s; render(s);
  return cell;
}

/* 시트의 세로 자리는 제목 높이에서 파생한다 — 큰 글씨에서도 안 겹치게 */
function layout(s){
  const fs=parseFloat(getComputedStyle(s.fr).getPropertyValue('--fs'))||1;
  const ti=(s.sc==='compact'?30:36)*fs;
  const top=s.topPad+52+ti*1.04+7+15*fs*1.45+16;
  s.sheet.style.left=s.pad+'px';
  s.sheet.style.top=top+'px';
  s.sheet.style.width=(s.w-s.pad*2-s.railRes)+'px';
  const avail=Math.max(120,s.h-s.botPad-top);
  s.sheet.style.height=avail+'px';
  /* ★유리는 **내용만큼만** 올라온다. 넘치면 남은 공간 전부(= 좁은 창), 모자라면 딱 그만큼(= 넓은 창).
     넓은 창에서 빈 유리가 남지 않고, 그만큼 하늘이 더 보인다 */
  const sb2=s.sheet.querySelector('.sbody');
  /* ★scrollHeight 로 재면 안 된다 — 그 값은 제 clientHeight 보다 절대 작아지지 않아
     방금 넣은 avail 이 그대로 돌아온다(=항상 꽉 찬다). **칸(.col)** 의 높이를 잰다 */
  const cs2=getComputedStyle(sb2);
  const vpad=parseFloat(cs2.paddingTop)+parseFloat(cs2.paddingBottom);
  const cols=[...sb2.querySelectorAll('.col')];
  const need=Math.max(...cols.map(c=>c.offsetHeight))+vpad+2;
  s.sheet.style.height=Math.min(avail,need)+'px';
  /* 넘치는 쪽에만 24px 페이드 — 「잘렸다」가 아니라 「더 있다」로 읽히게(홈 대화 패널과 같은 규칙) */
  const b=s.sheet.querySelector('.sbody');
  const fade=()=>{const up=b.scrollTop>2, dn=b.scrollTop+b.clientHeight<b.scrollHeight-2;
    const m=up&&dn?'linear-gradient(to bottom,transparent,#000 24px,#000 calc(100% - 24px),transparent)'
          :up?'linear-gradient(to bottom,transparent,#000 24px)'
          :dn?'linear-gradient(to bottom,#000 calc(100% - 24px),transparent)':'none';
    b.style.webkitMaskImage=m;b.style.maskImage=m;};
  fade(); b.onscroll=fade;
}
function render(s){ s.t=TNOW; paintSky(s); s.sb.textContent=clockAt(s.t); layout(s); }

let TNOW=.53, WKEY='clear';
const row=document.getElementById('deck');
const all=FRAMES.map(([k,w,h,c])=>{const cell=build(k,w,h,c);row.appendChild(cell);return cell.querySelector('.fr')._st;});
const redraw=()=>all.forEach(render);
requestAnimationFrame(redraw);
document.querySelectorAll('[data-wx]').forEach(b=>b.onclick=()=>{WKEY=b.dataset.wx;
  document.querySelectorAll('[data-wx]').forEach(x=>x.classList.toggle('on',x===b));redraw();});
tRange.oninput=()=>{TNOW=tRange.value/1000;tVal.textContent=clockAt(TNOW);redraw();};
tVal.textContent=clockAt(TNOW);
bBig.onclick=()=>{all.forEach(s=>s.fr.style.setProperty('--fs',1.25));
  bBig.classList.add('on');bNorm.classList.remove('on');requestAnimationFrame(redraw);};
bNorm.onclick=()=>{all.forEach(s=>s.fr.style.setProperty('--fs',1));
  bNorm.classList.add('on');bBig.classList.remove('on');requestAnimationFrame(redraw);};
bFit.onclick=()=>{document.body.dataset.fit='1';bFit.classList.add('on');bReal.classList.remove('on');requestAnimationFrame(redraw);};
bReal.onclick=()=>{document.body.dataset.fit='0';bReal.classList.add('on');bFit.classList.remove('on');requestAnimationFrame(redraw);};

</script>
